name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: dist is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: node scripts/build.mjs
      - name: Check
        run: node scripts/check.mjs
